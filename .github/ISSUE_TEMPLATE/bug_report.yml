name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please do not paste disk serial numbers or other personal data.
  - type: input
    id: version
    attributes:
      label: Foxide Helper version
      description: Settings → About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Disks — overview / health, Disks — speed test, Disks — wipe / partitioning, Memory, Stress test, Updates, Settings / other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected and what you got. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware (if related)
      description: Disk model and interface (NVMe / SATA / USB), GPU model, etc.
